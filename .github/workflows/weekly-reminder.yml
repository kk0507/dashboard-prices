name: weekly-reminder

on:
  schedule:
    # 每週日台北 10:03（UTC 02:03）；避開整點，GitHub 排程比較不會被延遲
    - cron: "3 2 * * 0"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send Discord reminder
        run: |
          MSG=$(jq -n --arg c "📋 週日看法更新提醒：對 Claude 說「更新看法」，我會用完整流程升級持股看法（官方法說原文核對、利空專查），並把每天自動更新的籌碼、技術面升級成完整版。戰情室：https://claude.ai/artifact/MEGC7PG4m7jeNBegCnJAGs" '{content:$c}')
          curl -sS -H "Content-Type: application/json" -d "$MSG" "$DISCORD_WEBHOOK_URL"
