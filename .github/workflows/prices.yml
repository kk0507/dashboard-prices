name: fetch-prices

on:
  schedule:
    # 台北 15:17 ~ 19:17 每小時一輪（UTC 07:17 ~ 11:17），避開整點以減少被延遲；19:17 是最後一輪
    - cron: "17 7 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "17 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    # 台北 21:47（UTC 13:47）：融資融券與櫃買籌碼比較晚公布，這一輪補齊並檢查資料完整度
    - cron: "47 13 * * 1-5"
    # 夜盤收盤（清晨 05:00）後只抓期貨：台北週二~週六 05:17、06:17（UTC 前一天 21:17、22:17），06:17 是夜盤最後一輪
    - cron: "17 21 * * 1-5"
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      final:
        description: "當作最後一輪（會檢查今天該有資料卻沒有）"
        type: boolean
        default: false
      night:
        description: "夜盤模式（只抓期貨，不抓股票）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Fetch prices
        if: github.event.schedule != '17 21 * * 1-5' && github.event.schedule != '17 22 * * 1-5' && inputs.night != true
        run: |
          if [ "${{ github.event.schedule }}" = "17 11 * * 1-5" ] || [ "${{ inputs.final }}" = "true" ]; then
            python fetch_prices.py --final
          else
            python fetch_prices.py
          fi

      - name: Fetch dividend notices (failure does not affect prices)
        if: github.event.schedule != '17 21 * * 1-5' && github.event.schedule != '17 22 * * 1-5' && inputs.night != true
        run: |
          python fetch_dividends.py || { [ "${{ github.event.schedule }}" = "17 11 * * 1-5" ] && echo "⚠️ 除權息預告今天抓取失敗（不影響收盤價）" >> alert.txt; true; }

      - name: Fetch futures (TX/TMF + institutional chips; failure does not affect prices)
        run: |
          if [ "${{ github.event.schedule }}" = "17 11 * * 1-5" ] || [ "${{ inputs.final }}" = "true" ]; then
            python fetch_futures.py --final || echo "⚠️ 期貨行情/法人籌碼今天抓取失敗（不影響股票收盤價）" >> alert.txt
          elif [ "${{ github.event.schedule }}" = "17 22 * * 1-5" ]; then
            python fetch_futures.py --night-final || echo "⚠️ 夜盤收盤後的期貨資料抓取失敗，戰情室期貨區塊會停在上一次" >> alert.txt
          else
            python fetch_futures.py || true
          fi

      - name: Update market data store and signals (failure does not affect prices)
        run: |
          FINALRUN=0; [ "${{ github.event.schedule }}" = "47 13 * * 1-5" ] && FINALRUN=1
          if python update_store.py && python build_signals.py; then
            if [ "$FINALRUN" = "1" ] && [ -f store_warn.txt ]; then { echo "⚠️ 籌碼資料不完整（不影響收盤價）："; cat store_warn.txt; } >> alert.txt; fi
          else
            [ "$FINALRUN" = "1" ] && echo "⚠️ 籌碼資料工廠今天更新失敗（不影響收盤價）" >> alert.txt
            true
          fi

      - name: Commit if changed
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          touch futures.json
          git add prices.json dividends.json signals.json data/
          [ -s futures.json ] && git add futures.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -q || true
            git push
          fi

      - name: Notify alert
        if: always() && hashFiles('alert.txt') != ''
        run: |
          MSG=$(python -c "import json;print(json.dumps({'content':open('alert.txt',encoding='utf-8').read()[:1800]}))")
          curl -sS -H "Content-Type: application/json" -d "$MSG" "$DISCORD_WEBHOOK_URL"

      - name: Notify success (once per trading day, when data is complete)
        if: hashFiles('notify.txt') != ''
        run: |
          MSG=$(python -c "import json;print(json.dumps({'content':open('notify.txt',encoding='utf-8').read()[:1800]}))")
          curl -sS -H "Content-Type: application/json" -d "$MSG" "$DISCORD_WEBHOOK_URL"

      - name: Notify failure
        if: failure()
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ 戰情室價格更新失敗（${{ github.event.schedule || '手動' }}），下一輪會自動重試。紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
